name: Translation Gap Engine

on:
  workflow_dispatch:
    inputs:
      book_count:
        description: "How many top English public-domain books to analyze"
        required: false
        default: "1000"
      stage:
        description: "How far to run the pipeline"
        required: false
        default: "full"
        type: choice
        options:
          - books_only
          - books_and_translations
          - full
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: translation-gap-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Network diagnostics
        run: |
          for url in \
            "https://gutendex.com/books?languages=en&sort=popular" \
            "https://www.gutenberg.org/" \
            "https://www.gutenberg.org/ebooks/search/?sort_order=downloads" \
            "https://openlibrary.org/search.json?q=test" \
            "https://query.wikidata.org/sparql?query=SELECT%20%3Fx%20WHERE%20%7B%7D%20LIMIT%201&format=json"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" "$url")
            echo "$code  $url"
          done

      - name: Test the real top-1000 Wikidata query (small limit first)
        run: |
          QUERY='SELECT ?work ?workLabel ?gutenbergId ?sitelinks (GROUP_CONCAT(DISTINCT ?authorLabel; separator="; ") AS ?authors) WHERE { ?work wdt:P2034 ?gutenbergId . ?work wdt:P407 wd:Q1860 . ?work wikibase:sitelinks ?sitelinks . OPTIONAL { ?work wdt:P50 ?author . ?author rdfs:label ?authorLabel . FILTER(LANG(?authorLabel)="en") } SERVICE wikibase:label { bd:serviceParam wikibase:language "en". } } GROUP BY ?work ?workLabel ?gutenbergId ?sitelinks ORDER BY DESC(?sitelinks) LIMIT 15'
          curl -s -G "https://query.wikidata.org/sparql" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            --data-urlencode "query=$QUERY" \
            -H "Accept: application/json" -o /tmp/wd_test.json
          python3 -m json.tool /tmp/wd_test.json | head -100
          echo "--- row count ---"
          python3 -c "import json; print(len(json.load(open('/tmp/wd_test.json'))['results']['bindings']))"

      - name: Fetch top books
        run: |
          python src/fetch_top_books.py \
            --count "${{ github.event.inputs.book_count || '1000' }}" \
            --out data/top_books.json

      - name: Fetch translation coverage
        if: ${{ github.event.inputs.stage != 'books_only' }}
        run: |
          python src/fetch_translations.py \
            --in data/top_books.json \
            --out data/translations.json

      - name: Compute gaps
        if: ${{ github.event.inputs.stage != 'books_only' && github.event.inputs.stage != 'books_and_translations' }}
        run: |
          python src/compute_gaps.py \
            --translations data/translations.json \
            --languages data/languages.csv \
            --out data/gaps.csv \
            --summary data/gaps_summary.md

      - name: Commit results
        run: |
          git config user.name "translation-gap-engine[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update translation gap report"
          git push
