name: Translation Gap Engine

on:
  workflow_dispatch:
    inputs:
      book_count:
        description: "How many top English public-domain books to analyze"
        required: false
        default: "1000"
      stage:
        description: "How far to run the English-source pipeline"
        required: false
        default: "full"
        type: choice
        options:
          - books_only
          - books_and_translations
          - full
      multilang_stage:
        description: "Reverse pipeline: top books IN other languages, checked for a missing English edition. 'skip' to not run it."
        required: false
        default: "skip"
        type: choice
        options:
          - skip
          - books_only
          - books_and_translations
          - full
      num_languages:
        description: "Multilang pipeline: how many top languages (by population) to search"
        required: false
        default: "50"
      count_per_language:
        description: "Multilang pipeline: how many top books to fetch per language"
        required: false
        default: "1000"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: translation-gap-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch top books
        run: |
          python src/fetch_top_books.py \
            --count "${{ github.event.inputs.book_count || '1000' }}" \
            --out data/top_books.json

      - name: Fetch translation coverage
        if: ${{ github.event.inputs.stage != 'books_only' }}
        run: |
          python src/fetch_translations.py \
            --in data/top_books.json \
            --out data/translations.json

      - name: Fetch world languages by population
        if: ${{ github.event.inputs.stage != 'books_only' && github.event.inputs.stage != 'books_and_translations' }}
        run: |
          python src/fetch_languages.py --out data/languages.csv

      - name: Compute gaps
        if: ${{ github.event.inputs.stage != 'books_only' && github.event.inputs.stage != 'books_and_translations' }}
        run: |
          python src/compute_gaps.py \
            --translations data/translations.json \
            --languages data/languages.csv \
            --out data/gaps.csv \
            --summary data/gaps_summary.md

      - name: Commit results
        run: |
          git config user.name "translation-gap-engine[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update translation gap report"
          git push

  run-multilang-engine:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.multilang_stage != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: translation-gap-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch top books per language
        run: |
          python src/fetch_top_books_multilang.py \
            --languages data/languages.csv \
            --num-languages "${{ github.event.inputs.num_languages || '50' }}" \
            --count-per-language "${{ github.event.inputs.count_per_language || '1000' }}" \
            --out data/top_books_multilang.json

      - name: Fetch translation coverage
        if: ${{ github.event.inputs.multilang_stage != 'books_only' }}
        run: |
          python src/fetch_translations.py \
            --in data/top_books_multilang.json \
            --out data/translations_multilang.json

      - name: Compute English-translation opportunities
        if: ${{ github.event.inputs.multilang_stage == 'full' }}
        run: |
          python src/compute_translation_opportunities.py \
            --translations data/translations_multilang.json \
            --out data/english_gaps.csv \
            --summary data/english_gaps_summary.md

      - name: Commit results
        run: |
          git config user.name "translation-gap-engine[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update multilingual translation opportunities report"
          git pull --rebase
          git push
