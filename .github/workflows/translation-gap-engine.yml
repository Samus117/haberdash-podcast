name: Translation Gap Engine

on:
  workflow_dispatch:
    inputs:
      book_count:
        description: "How many top English public-domain books to analyze"
        required: false
        default: "1000"
      stage:
        description: "How far to run the pipeline"
        required: false
        default: "full"
        type: choice
        options:
          - books_only
          - books_and_translations
          - full
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: translation-gap-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Explore Wikidata language-population data
        run: |
          echo "--- properties matching 'speakers' ---"
          QUERY1='SELECT ?prop ?propLabel WHERE { ?prop a wikibase:Property . ?prop rdfs:label ?label . FILTER(CONTAINS(LCASE(?label), "speakers")) FILTER(LANG(?label) = "en") SERVICE wikibase:label { bd:serviceParam wikibase:language "en". } }'
          curl -s -G "https://query.wikidata.org/sparql" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            --data-urlencode "query=$QUERY1" -H "Accept: application/json" | python3 -m json.tool

          echo "--- sample: top 20 languages by P1098 (number of speakers) ---"
          QUERY2='SELECT ?langLabel ?iso1 ?speakers WHERE { ?lang wdt:P1098 ?speakers . OPTIONAL { ?lang wdt:P218 ?iso1 . } SERVICE wikibase:label { bd:serviceParam wikibase:language "en". } } ORDER BY DESC(?speakers) LIMIT 20'
          curl -s -G "https://query.wikidata.org/sparql" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            --data-urlencode "query=$QUERY2" -H "Accept: application/json" -o /tmp/wd_langs.json
          python3 -m json.tool /tmp/wd_langs.json

          echo "--- total count of language items with P1098 set ---"
          QUERY3='SELECT (COUNT(DISTINCT ?lang) AS ?count) WHERE { ?lang wdt:P1098 ?speakers . }'
          curl -s -G "https://query.wikidata.org/sparql" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            --data-urlencode "query=$QUERY3" -H "Accept: application/json" | python3 -m json.tool

          echo "--- total count of all Wikidata items that are a kind of language ---"
          QUERY4='SELECT (COUNT(DISTINCT ?lang) AS ?count) WHERE { ?lang wdt:P31/wdt:P279* wd:Q34770 . }'
          curl -s -G "https://query.wikidata.org/sparql" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            --data-urlencode "query=$QUERY4" -H "Accept: application/json" | python3 -m json.tool

      - name: Fetch top books
        run: |
          python src/fetch_top_books.py \
            --count "${{ github.event.inputs.book_count || '1000' }}" \
            --out data/top_books.json

      - name: Fetch translation coverage
        if: ${{ github.event.inputs.stage != 'books_only' }}
        run: |
          python src/fetch_translations.py \
            --in data/top_books.json \
            --out data/translations.json

      - name: Compute gaps
        if: ${{ github.event.inputs.stage != 'books_only' && github.event.inputs.stage != 'books_and_translations' }}
        run: |
          python src/compute_gaps.py \
            --translations data/translations.json \
            --languages data/languages.csv \
            --out data/gaps.csv \
            --summary data/gaps_summary.md

      - name: Commit results
        run: |
          git config user.name "translation-gap-engine[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update translation gap report"
          git push
